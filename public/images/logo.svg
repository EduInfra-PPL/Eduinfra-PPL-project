<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none" width="100%" height="100%">
  <!-- Definitions: Gradients & Clip Paths -->
  <defs>
    <!-- Primary Orange Warm Gradient -->
    <linearGradient id="eduOrangeGrad" x1="6" y1="6" x2="54" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF6B3D" />
      <stop offset="100%" stop-color="#EA4A18" />
    </linearGradient>

    <!-- Pin Inner Shadow / Secondary Contrast -->
    <linearGradient id="pinContrastGrad" x1="16" y1="16" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFE8E0" />
    </linearGradient>
  </defs>

  <!-- ==================== ICON MARK (48x48 Base, Offset to X:8, Y:8) ==================== -->
  <g id="logo-mark" transform="translate(4, 4)">
    <!-- Rounded Background Accent Tile -->
    <rect x="2" y="2" width="52" height="52" rx="14" fill="#14171F" />

    <!-- Stylized Geotagged School Roof / Compass Arch -->
    <path d="M28 10L12 22.8V44C12 45.1 12.9 46 14 46H42C43.1 46 44 45.1 44 44V22.8L28 10Z" 
          fill="url(#eduOrangeGrad)" />

    <!-- Interior Structural Window & Geo-Target Ring (Negative Space) -->
    <path d="M28 20C23.58 20 20 23.58 20 28C20 33.5 26.5 40.5 28 42C29.5 40.5 36 33.5 36 28C36 23.58 32.42 20 28 20Z" 
          fill="#14171F" />

    <!-- Central Verification Focal Point / Radar Core -->
    <circle cx="28" cy="27.5" r="3.5" fill="url(#pinContrastGrad)" />

    <!-- Dynamic Foundation Line -->
    <path d="M19 41.5H37" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.9" />
  </g>

  <!-- ==================== LOGOTYPE / BRAND TYPOGRAPHY ==================== -->
  <g id="logotype" transform="translate(74, 38)">
    <!-- Primary Brand Wordmark: EduInfra -->
    <text x="0" y="0" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" 
          font-size="22" 
          font-weight="800" 
          letter-spacing="-0.5px" 
          fill="#14171F">
      EduInfra
    </text>

    <!-- Urgency / Action Dot in Primary Orange -->
    <circle cx="101" cy="-3" r="3" fill="#FF5C2A" />

    <!-- Category Descriptor: Tracker -->
    <text x="110" y="0" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" 
          font-size="22" 
          font-weight="400" 
          letter-spacing="-0.3px" 
          fill="#64748B">
      Tracker
    </text>

    <!-- Subtitle Badge for SDG 4 / 3T Context -->
    <text x="1" y="16" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" 
          font-size="9" 
          font-weight="700" 
          letter-spacing="1.2px" 
          fill="#FF5C2A">
      AUDIT FASILITAS &amp; MATCHING CSR
    </text>
  </g>
</svg>
